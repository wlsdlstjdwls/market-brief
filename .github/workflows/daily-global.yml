# 종목 브리핑 해외 평일 공시 갱신 (2026-11-23 사용자 지시, "해외도 국내처럼 매일").
#
# 국내 평일 갱신(daily-stocks.yml)과 같은 모양이다. 화~토 08:00 KST(미국 월~금 장 마감 뒤)에
# 최신 회차의 해외 종목들에 회차 날짜 이후 새 실적 발표(8-K Item 2.02)나 정기보고서(10-Q, 10-K, 20-F)가
# 있는지 SEC에서 보고, 있는 종목만 다시 수집해 그 회차 안에서 갈아 끼운다(patch-fin.ts, 국내와 같은 적재).
#
#   Vercel Cron(평일 23:00 UTC) → /api/cron/stocks?mode=global → workflow_dispatch → 여기
#
# 같은 날 두 번 돌아도 안전하다. 이미 본 접수번호는 다시 수집하지 않는다.
# 필요한 secret: DATABASE_URL, REPORTS_SSH_KEY(기존), SEC_USER_AGENT(연락처 메일. 없으면 SEC가 403).

name: daily-global

on:
  schedule:
    - cron: "30 1 * * 2-6"   # 화~토 10:30 KST — Vercel이 죽은 날의 백업
  workflow_dispatch:
    inputs:
      today:
        description: "확인 기준일 YYYY-MM-DD (비우면 오늘 KST)"
        required: false
        type: string

concurrency:
  group: stocks-ingest   # 토요일 적재, 국내 평일 갱신과 겹치지 않게
  cancel-in-progress: false

# 실패 알림이 실패한 step 이름을 Actions API로 읽는다.
permissions:
  contents: read
  actions: read

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}

    steps:
      - name: 본체 체크아웃
        uses: actions/checkout@v4

      - name: SEC 연락처 확인
        run: |
          if [ -z "$SEC_USER_AGENT" ]; then
            echo "::error::SEC_USER_AGENT secret이 없다. SEC가 러너 요청을 403으로 막는다."
            exit 1
          fi

      # 계산 함수만 불러 쓴다. 고치지 않는다
      - name: 수집기 체크아웃 (stock-analysis, 읽기 전용)
        uses: actions/checkout@v4
        with:
          repository: wlsdlstjdwls/stock-analysis
          ssh-key: ${{ secrets.REPORTS_SSH_KEY }}
          path: reports
          sparse-checkout: |
            fin_trend.py
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: 대상 목록 (해외만)
        run: mkdir -p /tmp/glb && npx tsx scripts/fin-daily-targets.ts /tmp/glb/targets.json USD

      - name: 새 공시 확인, 바뀐 종목만 다시 수집
        run: |
          python scripts/fin_global.py \
            --fin-trend reports/fin_trend.py \
            --targets /tmp/glb/targets.json \
            --out /tmp/glb \
            ${{ inputs.today && format('--today {0}', inputs.today) || '' }} | tee /tmp/glb/check.txt

      - name: 적재
        run: |
          npx tsx scripts/patch-fin.ts --dir /tmp/glb | tee /tmp/glb/patch.txt
          {
            echo "### 종목 브리핑 해외 공시 갱신"
            echo '```'; cat /tmp/glb/check.txt /tmp/glb/patch.txt; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 실패 알림
        if: failure()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          GH_TOKEN: ${{ github.token }}
          TARGET: ""
        run: bash scripts/notify-failure.sh "해외 종목 공시 갱신" "$TARGET"
